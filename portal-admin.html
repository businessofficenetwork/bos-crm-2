<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BON Portal Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#1F3A5F;--navy-deep:#16293F;--steel:#3E5C76;--gold:#B08D2E;--gold-bright:#C9A43C;
  --light:#EEF2F6;--paper:#FAFBFC;--ink:#22252A;--grey:#5A6472;--line:#D8DEE6;
  --green:#2E5E3A;--red:#8A2A2A;
  --body:'Segoe UI',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--paper);color:var(--ink);font-size:15px}
button{cursor:pointer;font-family:inherit}
.hidden{display:none!important}

/* TOP BAR */
.topbar{background:var(--navy-deep);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:20px;font-weight:700;letter-spacing:.05em}
.logo span{color:var(--gold-bright)}
.topbar-right{display:flex;align-items:center;gap:14px}
.unread-pill{background:var(--gold);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.btn-crm{background:rgba(255,255,255,.15);color:#fff;border:none;padding:7px 14px;font-size:13px;font-weight:600}
.btn-crm:hover{background:rgba(255,255,255,.25)}

/* LAYOUT */
.shell{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 56px)}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:16px 0;overflow-y:auto}
.sidebar-head{padding:8px 18px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--grey)}
.contractor-row{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.contractor-row:hover,.contractor-row.active{background:var(--light)}
.contractor-row.active{border-left:4px solid var(--gold)}
.co-init{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 36px}
.co-name{font-weight:600;font-size:14px}
.co-meta{font-size:12px;color:var(--grey)}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:auto;flex:0 0 8px}

/* MAIN */
.main-panel{padding:24px;overflow-y:auto}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.panel-title{font-size:20px;font-weight:700;color:var(--navy)}
.panel-actions{display:flex;gap:10px}
.btn-gold{background:var(--gold);color:#fff;border:none;padding:9px 18px;font-weight:700;font-size:14px}
.btn-gold:hover{background:var(--gold-bright)}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--navy);padding:9px 18px;font-weight:600;font-size:14px}
.btn-outline:hover{background:var(--light)}

/* TABS */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:20px}
.tab{padding:10px 18px;font-size:14px;font-weight:600;color:var(--grey);background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}
.tab:hover{color:var(--navy)}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);padding:14px;text-align:center}
.stat .n{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--navy)}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--grey);margin-top:3px}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:10px 12px;background:var(--navy);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--light)}
tr:last-child td{border-bottom:none}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;display:inline-block;white-space:nowrap}
.badge-new{background:#FFF3CD;color:#7A5A00}
.badge-progress{background:#D6EAF8;color:#1A5276}
.badge-approved{background:#D5F5E3;color:var(--green)}
.badge-closed{background:var(--light);color:var(--grey)}
.link-btn{color:var(--steel);font-weight:600;background:none;border:none;font-size:13px;padding:0;text-decoration:underline;cursor:pointer}
.link-btn:hover{color:var(--navy)}
.amt{font-family:var(--mono);font-weight:600;font-size:13px}

/* MESSAGES */
.msg-wrap{display:flex;flex-direction:column;gap:0}
.msg-item{border-bottom:1px solid var(--line);padding:14px 0}
.msg-item:last-child{border-bottom:none}
.msg-meta{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.msg-from{font-weight:700;font-size:14px;color:var(--navy)}
.msg-time{font-size:12px;color:var(--grey)}
.msg-unread-tag{background:var(--gold);color:#fff;font-size:11px;font-weight:700;padding:2px 8px}
.msg-body{font-size:14px;color:var(--ink);line-height:1.5;margin-bottom:10px;padding:10px 14px;background:var(--light);border-left:3px solid var(--steel)}
.reply-row{display:flex;gap:10px;margin-top:8px}
.reply-input{flex:1;padding:8px 12px;border:1.5px solid var(--line);font-family:inherit;font-size:14px}
.reply-input:focus{outline:none;border-color:var(--navy)}
.btn-send{background:var(--navy);color:#fff;border:none;padding:8px 18px;font-weight:700;font-size:14px}
.btn-send:hover{background:var(--steel)}

/* PORTAL LINK */
.portal-link-card{background:var(--navy-deep);color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.portal-link-text .t{font-weight:700;font-size:15px}
.portal-link-text .d{font-size:13px;color:#C7D3E0;margin-top:3px}
.portal-link-actions{display:flex;gap:10px}
.btn-copy{background:rgba(255,255,255,.15);color:#fff;border:none;padding:8px 16px;font-size:13px;font-weight:600}
.btn-copy:hover{background:rgba(255,255,255,.25)}

/* CREATE LOGIN */
.create-form{background:#fff;border:1px solid var(--line);padding:22px;margin-bottom:22px}
.create-form .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--steel)}
.field input,.field select{padding:9px 12px;border:1.5px solid var(--line);font-family:inherit;font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--navy)}

/* EMPTY / LOADING */
.empty{text-align:center;padding:40px 24px;color:var(--grey)}
.empty .icon{font-size:36px;margin-bottom:10px}
.loading{padding:30px;text-align:center;color:var(--grey);font-style:italic}
.alert{padding:10px 14px;margin-bottom:14px;font-size:14px;font-weight:600}
.alert-success{background:#D5F5E3;color:var(--green)}
.alert-error{background:#FFF0F0;color:var(--red)}

/* NO SELECTION */
.no-selection{display:flex;align-items:center;justify-content:center;height:100%;color:var(--grey)}
.no-selection .inner{text-align:center;padding:40px}
.no-selection .icon{font-size:48px;margin-bottom:14px}

@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{border-right:none;border-bottom:1px solid var(--line)}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">B<span>O</span>N <span style="font-size:14px;font-weight:500;color:#93A6BA;letter-spacing:.06em">PORTAL ADMIN</span></div>
  <div class="topbar-right">
    <span id="globalUnread" class="unread-pill hidden">0 unread</span>
    <a href="https://businessofficesystem.netlify.app" target="_blank" class="btn-crm">← Back to CRM</a>
  </div>
</div>

<div class="shell">

  <!-- SIDEBAR: contractor list -->
  <div class="sidebar">
    <div class="sidebar-head">Contractors</div>
    <div id="contractorList"><div class="loading">Loading…</div></div>
    <div style="padding:16px 18px 0;border-top:1px solid var(--line);margin-top:8px">
      <button class="btn-gold" style="width:100%;font-size:13px;padding:9px" onclick="showCreateLogin()">+ Add portal login</button>
    </div>
  </div>

  <!-- MAIN PANEL -->
  <div class="main-panel" id="mainPanel">
    <div class="no-selection">
      <div class="inner">
        <div class="icon">👈</div>
        <div style="font-weight:700;color:var(--navy);font-size:16px;margin-bottom:6px">Select a contractor</div>
        <div>Choose from the list to view their portal activity.</div>
      </div>
    </div>
  </div>

</div>

<!-- CREATE LOGIN MODAL -->
<div id="createModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center">
  <div style="background:#fff;width:100%;max-width:520px;padding:28px">
    <div style="font-weight:700;font-size:18px;color:var(--navy);margin-bottom:18px">Create Portal Login</div>
    <div id="createAlert" class="hidden alert"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="field"><label>Contractor</label>
        <select id="m_contractor"></select></div>
      <div class="field"><label>Display Name</label>
        <input type="text" id="m_display" placeholder="Crown Exteriors"></div>
      <div class="field"><label>Username</label>
        <input type="text" id="m_username" placeholder="crownexteriors"></div>
      <div class="field"><label>Password</label>
        <input type="text" id="m_password" placeholder="bon2025"></div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn-gold" onclick="createLogin()">Create login</button>
      <button class="btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
// ── CONFIG ──
const SUPABASE_URL = 'https://ezfrtcbmyifevyepgoym.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6ZnJ0Y2JteWlmZXZ5ZXBnb3ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5ODc1MDksImV4cCI6MjA5OTU2MzUwOX0.ijDR9I9tL5kctgV7CwQSdoFdr6JlPNuWR7YKIIq124Y';
const PORTAL_URL = 'https://businessofficenetwork.netlify.app/portal.html'; // update after deploy

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let contractors = [];
let selectedContractor = null;
let portalUsers = [];

// ── INIT ──
async function init() {
  const [{ data: ctrs }, { data: pu }, { data: msgs }] = await Promise.all([
    db.from('contractors').select('*').order('name'),
    db.from('portal_users').select('*'),
    db.from('portal_messages').select('id,contractor_id,is_read').eq('sender','contractor').eq('is_read',false)
  ]);
  contractors = ctrs || [];
  portalUsers = pu || [];
  const unreadByContractor = {};
  (msgs || []).forEach(m => { unreadByContractor[m.contractor_id] = (unreadByContractor[m.contractor_id]||0)+1; });

  const totalUnread = (msgs||[]).length;
  if (totalUnread > 0) {
    const pill = document.getElementById('globalUnread');
    pill.textContent = totalUnread + ' unread';
    pill.classList.remove('hidden');
  }

  const contractorSelect = document.getElementById('m_contractor');
  contractors.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.name;
    contractorSelect.appendChild(o);
  });

  const list = document.getElementById('contractorList');
  if (!contractors.length) { list.innerHTML = '<div class="loading">No contractors yet.</div>'; return; }

  list.innerHTML = contractors.map(c => {
    const pu = portalUsers.find(p => p.contractor_id === c.id);
    const unread = unreadByContractor[c.id] || 0;
    const initials = c.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    return `<div class="contractor-row" onclick="selectContractor('${c.id}')" id="crow_${c.id}">
      <div class="co-init">${initials}</div>
      <div>
        <div class="co-name">${c.name}</div>
        <div class="co-meta">${pu ? '✓ Portal active' : 'No portal login'}</div>
      </div>
      ${unread > 0 ? '<div class="unread-dot" title="'+unread+' unread"></div>' : ''}
    </div>`;
  }).join('');
}

// ── SELECT CONTRACTOR ──
async function selectContractor(id) {
  document.querySelectorAll('.contractor-row').forEach(r => r.classList.remove('active'));
  const row = document.getElementById('crow_'+id);
  if (row) row.classList.add('active');
  selectedContractor = contractors.find(c => c.id === id);
  renderContractorPanel();
}

async function renderContractorPanel() {
  const c = selectedContractor;
  const pu = portalUsers.find(p => p.contractor_id === c.id);
  document.getElementById('mainPanel').innerHTML = `
    <div class="panel-head">
      <div class="panel-title">${c.name}</div>
      <div class="panel-actions">
        ${pu ? `<a href="${PORTAL_URL}?preview=${c.id}" target="_blank" class="btn-outline" style="text-decoration:none;display:inline-block">View their portal ↗</a>` : ''}
        <button class="btn-gold" onclick="showCreateLogin('${c.id}')">
          ${pu ? 'Reset password' : 'Create login'}
        </button>
      </div>
    </div>
    ${pu ? `<div class="portal-link-card">
      <div class="portal-link-text">
        <div class="t">Portal credentials for ${c.name}</div>
        <div class="d">Username: <strong>${pu.username}</strong> · Password: <strong>${pu.portal_password}</strong> · Last login: ${pu.last_login ? new Date(pu.last_login).toLocaleDateString() : 'Never'}</div>
      </div>
      <div class="portal-link-actions">
        <button class="btn-copy" onclick="copyCredentials('${pu.username}','${pu.portal_password}')">Copy credentials</button>
      </div>
    </div>` : `<div style="background:var(--light);padding:16px;margin-bottom:20px;font-size:14px;color:var(--grey)">
      No portal login yet — click "Create login" to set one up.
    </div>`}
    <div class="tabs">
      <button class="tab active" onclick="showSubTab('claims',this)">Claims & Queue</button>
      <button class="tab" onclick="showSubTab('messages',this)">Messages</button>
      <button class="tab" onclick="showSubTab('docs',this)">Documents</button>
    </div>
    <div id="subContent"><div class="loading">Loading…</div></div>
    <div id="subAlert" class="hidden alert"></div>`;

  await loadClaimsTab();
}

function showSubTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (name === 'claims') loadClaimsTab();
  else if (name === 'messages') loadMessagesTab();
  else if (name === 'docs') loadDocsTab();
}

// ── CLAIMS TAB ──
async function loadClaimsTab() {
  const { data: claims } = await db.from('claims').select('*').eq('contractor_id', selectedContractor.id);
  if (!claims || !claims.length) {
    document.getElementById('subContent').innerHTML = `<div class="empty"><div class="icon">📋</div>No claims yet.</div>`;
    updateStats([], []);
    return;
  }
  const claimIds = claims.map(c => c.id);
  const { data: supps } = await db.from('supplements').select('*').in('claim_id', claimIds).order('created_at',{ascending:false});
  updateStats(claims, supps || []);
  const claimMap = {};
  claims.forEach(c => claimMap[c.id] = c);
  const rows = (supps||[]).map(s => {
    const cl = claimMap[s.claim_id] || {};
    const badge = stageBadgeAdmin(s.stage);
    return `<tr>
      <td><strong>${cl.property_address||'—'}</strong><br><span style="font-size:12px;color:var(--grey)">${cl.homeowner_name||''}</span></td>
      <td>${cl.carrier||'—'}</td>
      <td style="font-family:var(--mono);font-size:12px">${cl.claim_number||'—'}</td>
      <td>${badge}</td>
      <td class="amt">${s.supplement_approved ? '$'+Number(s.supplement_approved).toLocaleString() : s.supplement_requested ? '$'+Number(s.supplement_requested).toLocaleString()+' req' : '—'}</td>
      <td style="font-size:12px;color:var(--grey)">${s.intake_date||s.created_at?.slice(0,10)||'—'}</td>
      <td>
        <select onchange="updateStage('${s.id}',this.value)" style="font-size:12px;padding:4px 8px;border:1px solid var(--line)">
          ${['Intake','Docs Received','Reviewed','Supplement Written','Submitted','Carrier Response','Approved','Closed'].map(st =>
            `<option value="${st}" ${s.stage===st?'selected':''}>${st}</option>`).join('')}
        </select>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('subContent').innerHTML = `
    <div id="statsArea"></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Property</th><th>Carrier</th><th>Claim #</th><th>Status</th><th>Amount</th><th>Received</th><th>Update Stage</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" style="text-align:center;color:var(--grey);padding:20px">No supplements yet</td></tr>'}</tbody>
    </table></div>`;
  updateStats(claims, supps || []);
}

function updateStats(claims, supps) {
  const el = document.getElementById('statsArea');
  if (!el) return;
  const active = supps.filter(s => !['Closed','Approved'].includes(s.stage)).length;
  const approved = supps.filter(s => s.stage === 'Approved').length;
  const recovered = supps.reduce((sum,s) => sum+(Number(s.supplement_approved)||0),0);
  el.innerHTML = `<div class="stats">
    <div class="stat"><div class="n">${claims.length}</div><div class="k">Total Claims</div></div>
    <div class="stat"><div class="n">${active}</div><div class="k">In Progress</div></div>
    <div class="stat"><div class="n">${approved}</div><div class="k">Approved</div></div>
    <div class="stat"><div class="n" style="font-size:20px">${recovered?'$'+recovered.toLocaleString():'—'}</div><div class="k">Recovered</div></div>
  </div>`;
}

async function updateStage(suppId, stage) {
  const { error } = await db.from('supplements').update({ stage, updated_at: new Date().toISOString() }).eq('id', suppId);
  if (!error) {
    // notify contractor via portal message
    await db.from('portal_messages').insert({
      contractor_id: selectedContractor.id,
      sender: 'bon',
      message: `Update: your supplement has moved to "${stage}".`,
      is_read: false
    });
    showAlert('Stage updated and contractor notified.', true);
  }
}

// ── MESSAGES TAB ──
async function loadMessagesTab() {
  const { data: msgs } = await db.from('portal_messages')
    .select('*').eq('contractor_id', selectedContractor.id)
    .order('created_at', {ascending:true});

  // Mark contractor messages as read
  await db.from('portal_messages').update({is_read:true})
    .eq('contractor_id',selectedContractor.id).eq('sender','contractor');
  const dot = document.querySelector(`#crow_${selectedContractor.id} .unread-dot`);
  if (dot) dot.remove();

  const threadHtml = !msgs || msgs.length === 0
    ? `<div class="empty"><div class="icon">💬</div>No messages yet.</div>`
    : msgs.map(m => `
      <div class="msg-item">
        <div class="msg-meta">
          <span class="msg-from">${m.sender === 'bon' ? 'You (BON)' : selectedContractor.name}</span>
          <span class="msg-time">${new Date(m.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span>
          ${m.sender==='contractor' && !m.is_read ? '<span class="msg-unread-tag">Unread</span>' : ''}
        </div>
        <div class="msg-body">${m.message}</div>
      </div>`).join('');

  document.getElementById('subContent').innerHTML = `
    <div class="msg-wrap">${threadHtml}</div>
    <div style="margin-top:20px;border-top:1px solid var(--line);padding-top:16px">
      <div style="font-weight:700;font-size:13px;color:var(--grey);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Reply to ${selectedContractor.name}</div>
      <div class="reply-row">
        <textarea class="reply-input" id="replyText" placeholder="Type your message…" style="min-height:80px;resize:vertical"></textarea>
        <button class="btn-send" onclick="sendReply()">Send</button>
      </div>
    </div>`;
}

async function sendReply() {
  const text = document.getElementById('replyText').value.trim();
  if (!text) return;
  const { error } = await db.from('portal_messages').insert({
    contractor_id: selectedContractor.id,
    sender: 'bon',
    message: text,
    is_read: false
  });
  if (!error) await loadMessagesTab();
}

// ── DOCS TAB ──
async function loadDocsTab() {
  const { data: claims } = await db.from('claims').select('id,property_address').eq('contractor_id', selectedContractor.id);
  if (!claims || !claims.length) {
    document.getElementById('subContent').innerHTML = `<div class="empty"><div class="icon">📁</div>No claims yet.</div>`;
    return;
  }
  let html = '';
  for (const claim of claims) {
    const { data: files } = await db.storage.from('claim-docs').list(claim.id, {limit:50});
    if (!files || !files.length) continue;
    html += `<div style="margin-bottom:22px">
      <div style="font-weight:700;font-size:14px;color:var(--navy);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)">${claim.property_address||'Claim '+(claim.id.slice(0,8))}</div>
      ${files.map(f => {
        const path = `${claim.id}/${f.name}`;
        const size = f.metadata?.size ? (f.metadata.size/1024/1024).toFixed(1)+'MB' : '';
        return `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dotted var(--line);font-size:14px">
          <span style="flex:1">📄 ${f.name} <span style="color:var(--grey);font-size:12px">${size}</span></span>
          <button class="link-btn" onclick="downloadDoc('${path}','${f.name}')">Download</button>
        </div>`;
      }).join('')}
    </div>`;
  }
  document.getElementById('subContent').innerHTML = html || `<div class="empty"><div class="icon">📁</div>No documents uploaded yet.</div>`;
}

async function downloadDoc(path, filename) {
  const { data, error } = await db.storage.from('claim-docs').download(path);
  if (error || !data) { alert('Could not download file.'); return; }
  const url = URL.createObjectURL(data);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── CREATE LOGIN ──
function showCreateLogin(contractorId) {
  document.getElementById('createModal').classList.remove('hidden');
  document.getElementById('createAlert').classList.add('hidden');
  if (contractorId) document.getElementById('m_contractor').value = contractorId;
}
function closeModal() { document.getElementById('createModal').classList.add('hidden'); }

async function createLogin() {
  const contractor_id = document.getElementById('m_contractor').value;
  const username = document.getElementById('m_username').value.trim().toLowerCase().replace(/\s+/g,'');
  const portal_password = document.getElementById('m_password').value.trim();
  const display_name = document.getElementById('m_display').value.trim();
  const alertEl = document.getElementById('createAlert');
  if (!username || !portal_password) {
    alertEl.textContent = 'Username and password are required.';
    alertEl.className = 'alert alert-error'; alertEl.classList.remove('hidden');
    return;
  }
  const { error } = await db.from('portal_users').upsert({
    contractor_id, username, portal_password, display_name, is_active: true
  }, { onConflict: 'username' });
  if (error) {
    alertEl.textContent = 'Error: ' + error.message;
    alertEl.className = 'alert alert-error'; alertEl.classList.remove('hidden');
    return;
  }
  closeModal();
  showAlert('Portal login created for ' + (display_name || username), true);
  await init();
  if (selectedContractor) renderContractorPanel();
}

// ── HELPERS ──
function copyCredentials(username, password) {
  const text = `BON Portal: ${PORTAL_URL}\nUsername: ${username}\nPassword: ${password}`;
  navigator.clipboard.writeText(text).then(() => showAlert('Credentials copied to clipboard!', true));
}

function showAlert(msg, success) {
  const el = document.getElementById('subAlert') || document.createElement('div');
  if (!el.id) { el.id='subAlert'; document.getElementById('mainPanel').appendChild(el); }
  el.textContent = msg;
  el.className = 'alert ' + (success ? 'alert-success' : 'alert-error');
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 3500);
}

function stageBadgeAdmin(stage) {
  const map = {
    'Intake':'badge-new','Docs Received':'badge-new','Reviewed':'badge-progress',
    'Supplement Written':'badge-progress','Submitted':'badge-progress',
    'Carrier Response':'badge-progress','Approved':'badge-approved','Closed':'badge-closed'
  };
  return `<span class="badge ${map[stage]||'badge-new'}">${stage||'—'}</span>`;
}

// ── AUTO REFRESH ──
setInterval(async () => {
  if (!selectedContractor) return;
  const { data } = await db.from('portal_messages')
    .select('id').eq('contractor_id',selectedContractor.id)
    .eq('sender','contractor').eq('is_read',false);
  if (data && data.length > 0) {
    document.getElementById('globalUnread').textContent = data.length + ' unread';
    document.getElementById('globalUnread').classList.remove('hidden');
  }
}, 30000); // check every 30 seconds

init();
</script>

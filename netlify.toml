[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 13:00 UTC = 7am Central (CDT) / 8am Central (CST) - adjust if you'd
# rather it land at a different time. Weekdays only (Mon-Fri).
[functions."daily-digest"]
  schedule = "0 13 * * 1-5"

# Runs before the digest each morning so any new follow-up actions it
# queues show up in that day's digest.
[functions."supplement-followups"]
  schedule = "0 12 * * 1-5"

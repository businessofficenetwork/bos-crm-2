[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Netlify's secrets scanner flags any registered env var whose VALUE
# appears in the build output - portal.html hardcodes the Supabase
# project URL/anon key as plain JS constants (it's a static file, not
# templated through Vite). SUPABASE_URL/ANON_KEY and their VITE_
# counterparts hold the identical values, so both pairs need to be
# listed here, not just the VITE_ ones - the first attempt at this
# fix only covered VITE_ and the scan still failed on the plain
# names. All four are meant to be public (Supabase URL + anon key,
# protected by Row Level Security, not secrecy) - never add
# SUPABASE_SERVICE_ROLE_KEY here, that one is a real secret.
# NOTIFY_EMAIL is BON's own support address, intentionally shown to
# contractors as contact info on portal.html - also not a secret.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,SUPABASE_URL,SUPABASE_ANON_KEY,NOTIFY_EMAIL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 13:00 UTC = 7am Central (CDT) / 8am Central (CST) - adjust if you'd
# rather it land at a different time. Weekdays only (Mon-Fri).
[functions."daily-digest"]
  schedule = "0 13 * * 1-5"

# Runs before the digest each morning so any new follow-up actions it
# queues show up in that day's digest.
[functions."supplement-followups"]
  schedule = "0 12 * * 1-5"
